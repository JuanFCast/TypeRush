# Cierre diario de TypeRush GameV2 (Celo Mainnet). Lo corre el OPERATOR BOT:
# registra al ganador del día con rollDay() y detecta claims. NO paga — el ganador
# reclama él mismo con claim().
#
# RESPALDO: el disparo principal es el cron de Supabase (supabase/gamev2_robots.sql →
# Edge Function close-day, 8:05 p.m. Colombia). Este workflow corre a las 8:35 p.m.
# por si aquel falla — es idempotente (si el día ya está cerrado, se salta). El cron
# de GitHub es impuntual (se retrasa o se salta), por eso dejó de ser el principal.
# También se puede lanzar a mano (Actions → Close day → Run workflow).
#
# ⚠️ RETIRADO (2026-08-09). El juego se mudó a GameV3 el 2026-08-06 y V2 ya no recibe
# partidas, así que no hay rondas que cerrar: este workflow se despertaba cada noche solo
# para fallar. El cron está QUITADO a propósito, no comentado a medias — sin `schedule` no
# puede dispararse solo. Se deja el archivo, y `workflow_dispatch`, por una razón concreta:
# V2 todavía guarda premios sin reclamar (dinero de jugadores reales), y si alguna vez hay
# que tocar una ronda vieja a mano, la herramienta tiene que seguir existiendo.
# Se deja además DESACTIVADO en GitHub (Actions → Close day (GameV2) → ··· → Disable).
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   GAMEV2_CONTRACT_ADDRESS
#   OPERATOR_KEY                      (clave del Operator Bot; solo cierra días, no maneja fondos)
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   NEXT_PUBLIC_GAMEV2_USDT_ADDRESS
#   NEXT_PUBLIC_GAMEV2_COPM_ADDRESS

name: Close day (GameV2)

on:
  workflow_dispatch:

concurrency:
  group: close-day
  cancel-in-progress: false

jobs:
  close-day:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24" # el mismo que en local; ver la nota en seed-v3.yml
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Close day (register winner on-chain)
        run: npm run close-day
        env:
          GAMEV2_CONTRACT_ADDRESS: ${{ secrets.GAMEV2_CONTRACT_ADDRESS }}
          OPERATOR_KEY: ${{ secrets.OPERATOR_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_GAMEV2_USDT_ADDRESS: ${{ secrets.NEXT_PUBLIC_GAMEV2_USDT_ADDRESS }}
          NEXT_PUBLIC_GAMEV2_COPM_ADDRESS: ${{ secrets.NEXT_PUBLIC_GAMEV2_COPM_ADDRESS }}
