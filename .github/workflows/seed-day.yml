# Siembra del premio diario de TypeRush GameV2 (Celo Mainnet). Lo corre el FUNDER:
# completa el piso de premio del día activo (1 USDT + 1.500 COPm por modo es/en).
# Idempotente (solo aporta lo que falte).
#
# RESPALDO: el disparo principal es el cron de Supabase (supabase/gamev2_robots.sql →
# Edge Function seed-day, 8:02 p.m. Colombia). Este workflow corre a las 8:32 p.m.
# por si aquel falla — es idempotente, correr doble no duplica premios. El cron de
# GitHub es impuntual (se retrasa o se salta), por eso dejó de ser el principal.
# También se puede lanzar a mano (Actions → Seed day → Run workflow).
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   GAMEV2_CONTRACT_ADDRESS
#   PRIVATE_KEY                       (clave de Funder Rewards; wallet con USDT/COPm + CELO)
#   NEXT_PUBLIC_SUPABASE_URL          \ para comprobar si la ronda que cerró tuvo jugadores
#   SUPABASE_SERVICE_ROLE_KEY         /  (sin esto la siembra se omite por seguridad)
#   NEXT_PUBLIC_GAMEV2_USDT_ADDRESS
#   NEXT_PUBLIC_GAMEV2_COPM_ADDRESS

name: Seed day (GameV2)

on:
  workflow_dispatch:
  schedule:
    - cron: "32 1 * * *"   # 01:32 UTC = 8:32 p.m. Colombia (RESPALDO del cron de Supabase)

concurrency:
  group: seed-day
  cancel-in-progress: false

jobs:
  seed-day:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24" # el mismo que en local; ver la nota en seed-v3.yml
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed today's prize floor
        run: npm run seed-day
        env:
          GAMEV2_CONTRACT_ADDRESS: ${{ secrets.GAMEV2_CONTRACT_ADDRESS }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_GAMEV2_USDT_ADDRESS: ${{ secrets.NEXT_PUBLIC_GAMEV2_USDT_ADDRESS }}
          NEXT_PUBLIC_GAMEV2_COPM_ADDRESS: ${{ secrets.NEXT_PUBLIC_GAMEV2_COPM_ADDRESS }}
